<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Void Drop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #060609;
            color: #ffffff;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 0, #1c1508 0%, #060609 75%);
        }
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060609;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .app-viewport {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #08080c;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .app-header {
            padding: 16px;
            background: rgba(12, 12, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            background: transparent;
        }
        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .brand-title span {
            color: #f59e0b;
        }
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .screen::-webkit-scrollbar {
            display: none;
        }
        .screen.active {
            display: flex;
        }
        .scroll-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 6px;
            margin-bottom: 10px;
            width: 100%;
        }
        .scroll-row::-webkit-scrollbar {
            display: none;
        }
        .chip-sub {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #666670;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .chip-sub.active {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.4);
        }
        .cards-feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
            flex: 1;
        }
        .reward-card {
            background: rgba(18, 18, 26, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
            transition: transform 0.4s ease, opacity 0.4s ease, background 0.2s ease;
        }
        .reward-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }
        .reward-card:active {
            transform: scale(0.98);
            background: rgba(28, 28, 38, 0.9);
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-icon {
            width: 46px;
            height: 46px;
            object-fit: contain;
            background: transparent;
            border: none;
        }
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .card-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-game {
            font-size: 9px;
            font-weight: 900;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag-sub {
            font-size: 9px;
            font-weight: 700;
            color: #8e8e93;
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 1px;
        }
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f59e0b;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }
        .detail-image {
            width: 68px;
            height: 68px;
            object-fit: contain;
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .detail-name {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }
        .qr-card {
            background: #ffffff;
            padding: 12px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            margin: 8px 0;
            display: inline-block;
        }
        .qr-card img {
            width: 170px;
            height: 170px;
            display: block;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
        }
        .btn-act {
            background: rgba(20, 20, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 12px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .btn-act.primary {
            background: #f59e0b;
            color: #060609;
            border: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .btn-act:active {
            transform: scale(0.96);
        }
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            width: 100%;
            margin: 14px 0;
        }
        .vote-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vote-title {
            font-size: 10px;
            font-weight: 800;
            color: #666670;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        .vote-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-v {
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: stretch;
            border: 1px solid transparent;
            overflow: hidden;
            padding: 0;
            transition: all 0.2s ease;
        }
        .btn-v:active {
            transform: scale(0.96);
        }
        .btn-v.ok {
            background: rgba(52, 199, 89, 0.12);
            color: #34c759;
        }
        .btn-v.off {
            background: rgba(255, 59, 48, 0.12);
            color: #ff3b30;
        }
        .vote-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
        }
        .app-footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
        }
        .footer-main {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
        }
        .footer-link {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
            cursor: pointer;
            padding: 10px 16px;
            display: inline-block;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .footer-link:active {
            opacity: 0.7;
            transform: scale(0.97);
        }
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <img src="load.gif" alt="Carregando" style="width: 40px; height: 40px; opacity: 0.8;">
    </div>
    <div class="app-viewport">
        <header class="app-header">
            <div class="brand">
                <img src="logo.png" alt="Logo" class="brand-icon" id="mainLogo" onerror="this.style.display='none'">
                <div class="brand-title">VOID<span>DROP</span></div>
            </div>
        </header>
        <main id="screenHome" class="screen active">
            <div class="scroll-row" id="subcatsRow" style="display:none;"></div>
            <div class="cards-feed" id="feedCards"></div>
            <footer class="app-footer">
                <span class="footer-main">Feito por VoidHub</span>
                <span class="footer-link" onclick="abrirDiscord()">Clique aqui para acessar o discord</span>
            </footer>
        </main>
        <div id="screenDetail" class="screen">
            <div class="top-nav">
                <button class="btn-back" onclick="voltarHome()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    VOLTAR
                </button>
                <span id="detailTagHeader" style="font-size:10px; font-weight:900; color:#f59e0b; letter-spacing:1px;">BRAWL STARS</span>
            </div>
            <div class="detail-header">
                <img id="detailLogoImg" class="detail-image" src="" alt="Logo">
                <h2 id="detailTitleTxt" class="detail-name"></h2>
                <div id="qrContainer" class="qr-card">
                    <img id="detailQrImg" src="" alt="QR Code">
                </div>
                <div class="actions-grid" id="actionsGrid">
                    <button id="btnAbrir" class="btn-act primary" onclick="acaoAbrir()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                        ABRIR
                    </button>
                    <button class="btn-act" onclick="acaoCopiar()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        COPIAR
                    </button>
                    <button class="btn-act" onclick="acaoCompartilhar()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                        ENVIAR
                    </button>
                </div>
                <div class="divider"></div>
                <div class="vote-block">
                    <span class="vote-title">STATUS DA RECOMPENSA</span>
                    <div class="vote-buttons">
                        <button class="btn-v ok" id="btnVoteOk" onclick="votar('ok')">
                            <div class="vote-action">
                                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 1.98-1.68l1.53-8.5A2 2 0 0 0 19.82 9H14zM2 9h4v12H2z"/></svg>
                                FUNCIONOU
                            </div>
                        </button>
                        <button class="btn-v off" id="btnVoteOff" onclick="votar('off')">
                            <div class="vote-action">
                                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-1.98 1.68l-1.53 8.5A2 2 0 0 0 4.18 15H10zm12-6h-4V2h4v7z"/></svg>
                                EXPIRADO
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let appData = {};
        let subFiltro = "todas";
        let itemSelecionado = null;

        let loadTimeout = setTimeout(() => {
            esconderLoading();
        }, 10000);

        function esconderLoading() {
            clearTimeout(loadTimeout);
            const loader = document.getElementById('loadingScreen');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        function receberDadosDoAndroid(jsonBase64) {
            try {
                const jsonString = decodeURIComponent(escape(window.atob(jsonBase64)));
                appData = JSON.parse(jsonString);
                
                if (appData.games && appData.games.length > 0 && appData.games[0].icon) {
                    document.getElementById('mainLogo').src = appData.games[0].icon;
                }
                
                montarSubcategorias();
                renderizarCards();
                esconderLoading();
            } catch (e) {
                console.error(e);
                esconderLoading();
            }
        }

        function montarSubcategorias() {
            const row = document.getElementById('subcatsRow');
            row.innerHTML = '';
            
            if (!appData.rewards || !appData.rewards['brawl_stars']) {
                row.style.display = 'none';
                return;
            }
            
            const subs = new Set();
            appData.rewards['brawl_stars'].forEach(i => {
                if(i.subcategory) subs.add(i.subcategory);
            });
            
            if (subs.size === 0) {
                row.style.display = 'none';
                return;
            }
            
            row.style.display = 'flex';
            const btnTodas = document.createElement('button');
            btnTodas.className = 'chip-sub active';
            btnTodas.innerText = 'Todas';
            btnTodas.onclick = (e) => filtrarSub('todas', e.target);
            row.appendChild(btnTodas);
            
            subs.forEach(s => {
                const b = document.createElement('button');
                b.className = 'chip-sub';
                b.innerText = s;
                b.onclick = (e) => filtrarSub(s, e.target);
                row.appendChild(b);
            });
        }

        function filtrarSub(sub, el) {
            document.querySelectorAll('#subcatsRow .chip-sub').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            subFiltro = sub;
            renderizarCards();
        }

        function renderizarCards() {
            const feed = document.getElementById('feedCards');
            feed.innerHTML = '';
            if (!appData.rewards || !appData.rewards['brawl_stars']) return;

            appData.rewards['brawl_stars'].forEach(item => {
                if (subFiltro !== 'todas' && item.subcategory !== subFiltro) return;
                
                const card = document.createElement('div');
                card.className = 'reward-card';
                card.onclick = () => verDetalhes(item);
                
                const imgSrc = item.logo || item.icon || 'https://via.placeholder.com/46';
                
                card.innerHTML = `
                    <div class="card-left">
                        <img class="card-icon" src="${imgSrc}" onload="this.closest('.reward-card').classList.add('loaded')" onerror="this.closest('.reward-card').classList.add('loaded')">
                        <div class="card-details">
                            <div class="card-tags">
                                <span class="tag-game">BRAWL STARS</span>
                                <span class="tag-sub">${item.subcategory}</span>
                            </div>
                            <span class="card-title">${item.name}</span>
                        </div>
                    </div>
                    <svg class="svg-icon" style="color:#444450;" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                `;
                feed.appendChild(card);
            });
        }

        function verDetalhes(item) {
            itemSelecionado = item;
            document.getElementById('detailTagHeader').innerText = `BRAWL STARS • ${item.subcategory.toUpperCase()}`;
            document.getElementById('detailTitleTxt').innerText = item.name;
            
            document.getElementById('detailLogoImg').src = item.logo;
            document.getElementById('detailQrImg').src = item.qr_code || item.qr;

            // Configuração dos botões de voto baseado no salvamento local
            const btnOk = document.getElementById('btnVoteOk');
            const btnOff = document.getElementById('btnVoteOff');
            
            // Reseta visual primeiro
            btnOk.style.opacity = '1';
            btnOff.style.opacity = '1';
            btnOk.style.border = '1px solid rgba(52, 199, 89, 0.35)';
            btnOff.style.border = '1px solid rgba(255, 59, 48, 0.35)';
            btnOk.style.background = 'rgba(52, 199, 89, 0.12)';
            btnOff.style.background = 'rgba(255, 59, 48, 0.12)';
            btnOk.style.pointerEvents = 'auto';
            btnOff.style.pointerEvents = 'auto';
            
            // Checa se já votou nesse item
            const votoSalvo = localStorage.getItem('void_vote_' + item.id);
            if (votoSalvo === 'ok') {
                btnOk.style.border = '2px solid #34c759';
                btnOk.style.background = 'rgba(52, 199, 89, 0.25)';
                btnOff.style.opacity = '0.3';
                btnOk.style.pointerEvents = 'none';
                btnOff.style.pointerEvents = 'none';
            } else if (votoSalvo === 'off') {
                btnOff.style.border = '2px solid #ff3b30';
                btnOff.style.background = 'rgba(255, 59, 48, 0.25)';
                btnOk.style.opacity = '0.3';
                btnOk.style.pointerEvents = 'none';
                btnOff.style.pointerEvents = 'none';
            }

            document.getElementById('screenHome').classList.remove('active');
            document.getElementById('screenDetail').classList.add('active');
        }

        function voltarHome() {
            document.getElementById('screenDetail').classList.remove('active');
            document.getElementById('screenHome').classList.add('active');
        }

        function checarVoltar() {
            const detail = document.getElementById('screenDetail');
            if (detail.classList.contains('active')) {
                voltarHome();
                return "true";
            }
            return "false";
        }
        
        function abrirDiscord() {
            const link = (appData && appData.discord_link) ? appData.discord_link : "https://discord.gg/anajUFDRR5";
            if (window.AndroidBridge) {
                window.AndroidBridge.abrirLink(link);
            }
        }

        function acaoAbrir() {
            if (itemSelecionado && itemSelecionado.link) {
                if (window.AndroidBridge) window.AndroidBridge.abrirLink(itemSelecionado.link);
            }
        }

        function acaoCopiar() {
            if (itemSelecionado && itemSelecionado.link) {
                if (window.AndroidBridge) window.AndroidBridge.copiar(itemSelecionado.link);
            }
        }

        function acaoCompartilhar() {
            if (itemSelecionado && itemSelecionado.link) {
                if (window.AndroidBridge) window.AndroidBridge.compartilhar(itemSelecionado.name, itemSelecionado.link);
            }
        }

        function votar(tipo) {
            if (itemSelecionado && itemSelecionado.id) {
                // Checa trava local para evitar spam duplo
                const jaVotou = localStorage.getItem('void_vote_' + itemSelecionado.id);
                if (jaVotou) {
                    return; // Se já tiver voto, apenas ignora
                }

                // Dispara comunicação pro Cloudflare via Java
                if (window.AndroidBridge) {
                    window.AndroidBridge.votar(itemSelecionado.id, tipo);
                }
                
                // Trava o voto localmente
                localStorage.setItem('void_vote_' + itemSelecionado.id, tipo);
                
                // Recarrega os estilos dos botões pra mostrar a seleção na hora
                verDetalhes(itemSelecionado);
            }
        }
    </script>
</body>
</html>
